name: Redpanda (latest)

# Non-blocking check (declared in xtask/ci_job_parity.py): the Redpanda suite
# against the current `latest` image, weekly and on demand. A red run means a
# Redpanda release changed something; it cannot fail `CI`, which runs the
# pinned release (tests/redpanda/Dockerfile).
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Redpanda image tag to test'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  redpanda:
    name: Integration Tests (Redpanda ${{ inputs.version || 'latest' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - run: just integration-redpanda
        env:
          REDPANDA_VERSION: ${{ inputs.version || 'latest' }}
