name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Perform a dry run (do not actually publish)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # A crates.io version is permanent: a yanked number is burned and can never
  # be reused. So the tag is gated on the *same* evidence a pull request is,
  # not on a lighter subset.
  #
  # This used to be two `cargo test` invocations and nothing else — no protocol
  # parity, no reachability checks, no secret-Debug scan, no cargo-deny, no
  # integration suite. The mitigating assumption was that a tag is cut from a
  # green `main`, which was never actually enforced anywhere.
  #
  # `just ci` is the full local gate; the Docker suites stay out of it because
  # they need a broker, and they have already run on this commit via ci.yml.
  verify:
    name: Verify release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      - run: just ci
      - name: Supply chain
        run: |
          cargo install --locked cargo-deny || true
          cargo deny check advisories bans licenses sources

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Get version from tag
        if: github.event_name == 'push'
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "version=$CARGO_VERSION" >> $GITHUB_OUTPUT
          echo "Version verified: $CARGO_VERSION"

      # `ring` and `rustls-aws-lc-rs` are additive, so `--all-features` works
      # and needs no feature list duplicated from ci.yml.
      - name: Run tests (all features)
        run: cargo test --all-features

      # The published crate's DEFAULT features are `compression` + `ring`, which
      # is what downstream users get. Test that configuration too -- the
      # all-features run resolves to the aws-lc-rs backend and never exercises
      # the ring code paths.
      - name: Run tests (default features)
        run: cargo test

      - name: Dry run publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run == true
        run: cargo publish --dry-run

      - name: Publish to crates.io
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry-run == false)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
