name: Release

# Not a check (declared in xtask/ci_job_parity.py): publishes a tagged commit.
#
#   gate     the tag is `v<Cargo.toml version>`, the commit is on `main`, and
#            the latest `CI` check run on it concluded `success`
#   deny     cargo-deny again (an advisory can appear after CI ran)
#   package  `cargo package` once, in a job with no write, OIDC or attestation
#            permission; the CycloneDX SBOM is checked against `cargo tree`
#   attest   build provenance for exactly that `.crate` and the SBOM
#   publish  in the `release` environment (a required reviewer approves):
#            repackages from the same commit without building and stops if the
#            digest differs, then publishes through crates.io Trusted
#            Publishing with a token minted for this run
#   verify   downloads what crates.io serves; its sha256, the attested digest
#            and the sparse-index `cksum` must agree, and `gh attestation
#            verify` must accept the downloaded file
#   release  the GitHub Release, carrying the `.crate` and the attested SBOM
#
# A manual dispatch runs gate (report only), deny and package, and stops: no
# input makes it publish.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag, branch and CI status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$DISPATCH" = "true" ]; then
            python3 xtask/release_gate.py || echo "Dry run: the gate above would stop a release."
          else
            python3 xtask/release_gate.py
          fi

  deny:
    name: Supply chain (cargo-deny)
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2
      - run: just deny

  package:
    name: Package
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.digest.outputs.version }}
      crate-sha256: ${{ steps.digest.outputs.crate-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.95"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-cyclonedx@0.5.9
      - run: just release-package dist
      - id: digest
        run: |
          v="$(just version)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "crate-sha256=$(sha256sum "dist/krafka-$v.crate" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  attest:
    name: Attest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [package, deny]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: The artifact is the packaged file
        env:
          VERSION: ${{ needs.package.outputs.version }}
          EXPECTED: ${{ needs.package.outputs.crate-sha256 }}
        run: echo "$EXPECTED  dist/krafka-$VERSION.crate" | sha256sum --check
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/krafka-*.crate
            dist/krafka-*.cdx.json

  publish:
    name: Publish to crates.io
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [package, attest]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.95"
      # `--no-verify`: this job compiles neither krafka nor any dependency.
      - name: Repackage and compare with the attested artifact
        env:
          VERSION: ${{ needs.package.outputs.version }}
          EXPECTED: ${{ needs.package.outputs.crate-sha256 }}
        run: |
          cargo package --locked --no-verify
          echo "$EXPECTED  target/package/krafka-$VERSION.crate" | sha256sum --check
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  verify:
    name: Verify what crates.io serves
    needs: [package, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Served, attested and index digests agree
        env:
          VERSION: ${{ needs.package.outputs.version }}
          ATTESTED: ${{ needs.package.outputs.crate-sha256 }}
        run: python3 xtask/verify_published.py --version "$VERSION" --crate "dist/krafka-$VERSION.crate" --attested "$ATTESTED" --wait 600
      - name: The downloaded crate carries this workflow's attestation
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          curl -sSfL -o "served-$VERSION.crate" "https://static.crates.io/crates/krafka/krafka-$VERSION.crate"
          gh attestation verify "served-$VERSION.crate" --repo "$REPO" \
            --signer-workflow "$REPO/.github/workflows/publish.yml"

  release:
    name: GitHub Release
    needs: [package, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Create the release with the crate and its SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          gh release create "v$VERSION" --repo "$REPO" --verify-tag --generate-notes \
            --title "v$VERSION" "dist/krafka-$VERSION.crate" "dist/krafka-$VERSION.cdx.json"
