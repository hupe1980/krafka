[package]
name = "krafka-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"

[dependencies.krafka]
path = ".."
features = ["telemetry", "unstable-protocol"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_kafka_array"
path = "fuzz_targets/fuzz_kafka_array.rs"
doc = false

[[bin]]
name = "fuzz_record_batch"
path = "fuzz_targets/fuzz_record_batch.rs"
doc = false

[[bin]]
name = "fuzz_response_decode"
path = "fuzz_targets/fuzz_response_decode.rs"
doc = false

[[bin]]
name = "fuzz_scram"
path = "fuzz_targets/fuzz_scram.rs"
doc = false
