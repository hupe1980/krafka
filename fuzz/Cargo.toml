[package]
name = "krafka-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"

[dependencies.krafka]
path = ".."
# `oauth-oidc` compiles the HTTP parser `fuzz_oidc_http` reaches; `zstd` the
# encoder `fuzz_decompression_cap` builds zstd bombs with.
features = ["unstable-protocol", "internal", "oauth-oidc", "zstd"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_kafka_array"
path = "fuzz_targets/fuzz_kafka_array.rs"
doc = false

[[bin]]
name = "fuzz_record_batch"
path = "fuzz_targets/fuzz_record_batch.rs"
doc = false

[[bin]]
name = "fuzz_response_decode"
path = "fuzz_targets/fuzz_response_decode.rs"
doc = false

[[bin]]
name = "fuzz_scram"
path = "fuzz_targets/fuzz_scram.rs"
doc = false

# Request *encode* paths: encoding must never panic on any constructible
# request at any advertised version.
[[bin]]
name = "fuzz_request_encode"
path = "fuzz_targets/fuzz_request_encode.rs"
doc = false

# Framing header plus standalone primitives (KafkaString/KafkaBytes/
# KafkaArray/TaggedFields), which message decoders only reach indirectly.
[[bin]]
name = "fuzz_header_primitives"
path = "fuzz_targets/fuzz_header_primitives.rs"
doc = false

# The OIDC token client's HTTP/1.1 response parser against its line,
# header-count and body caps.
[[bin]]
name = "fuzz_oidc_http"
path = "fuzz_targets/fuzz_oidc_http.rs"
doc = false

# Record-batch decompression under a small cap, in every codec.
[[bin]]
name = "fuzz_decompression_cap"
path = "fuzz_targets/fuzz_decompression_cap.rs"
doc = false
