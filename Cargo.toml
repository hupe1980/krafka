[package]
name = "krafka"
version = "0.21.0"
edition = "2024"
rust-version = "1.88"
authors = ["hupe1980"]
description = "A pure Rust, async-native Apache Kafka client"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/krafka"
documentation = "https://docs.rs/krafka"
readme = "README.md"
keywords = ["kafka", "async", "streaming", "messaging"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# Async runtime
tokio = { version = "1.26", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-util = { version = "0.7", default-features = false, features = ["time"] }

# Zero-copy buffers
bytes = "1"

# Error handling
thiserror = "2"

# Stream trait for async iteration
futures-core = "0.3"

# FutureExt::catch_unwind for panic-safe event loop tasks
futures = { version = "0.3", default-features = false, features = ["async-await", "std"] }

# Logging and tracing
tracing = "0.1"

# Compression (each codec is individually feature-gated)
flate2 = { version = "1", optional = true }            # gzip record-batch compression + Glue ZLIB
snap = { version = "1", optional = true }             # snappy
lz4_flex = { version = "0.11", optional = true }      # lz4
zstd = { version = "0.13", optional = true }          # zstd (requires C toolchain via zstd-sys)

# CRC32 for protocol
crc32c = "0.6"

# Random number generation
rand = "0.9"

# Synchronization (non-poisoning RwLock)
parking_lot = "0.12"

# Fast non-cryptographic hasher for hot-path HashMap lookups.
ahash = "0.8"

# TCP keepalive configuration
socket2 = "0.5"

# Cryptography for SASL/SCRAM
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
base64 = "0.22"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2"

# TLS/SSL support
tokio-rustls = { version = "0.26", default-features = false, features = ["logging"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
webpki-roots = "1"
rustls-native-certs = { version = "0.8", optional = true }

# AWS SDK for MSK IAM authentication (optional)
# Note: The aws-config crate adds ~2-3 MB to binary size (release build).
# For smaller binaries, use AwsMskIamCredentials::from_env() which
# works without the aws-msk feature (manual credential loading).
# Keep aws-config focused on the credential providers CLI/client apps expect
# (credentials-process, sso) and opt into the modern HTTPS client explicitly.
aws-config = { version = "1", optional = true, default-features = false, features = ["credentials-process", "default-https-client", "rt-tokio", "sso"] }
aws-credential-types = { version = "1", optional = true }
arc-swap = "1.9.0"

# SOCKS5 proxy support (optional)
tokio-socks = { version = "0.5", optional = true }

# JSON serialisation for the OIDC token provider (optional)
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = ["compression", "ring"]
# Enable pure-Rust compression codecs.
compression = ["gzip", "snappy", "lz4"]
# Enable all compression codecs, including zstd.
compression-all = ["compression", "zstd"]
# Enable gzip record-batch compression/decompression.
# Also activates the `flate2` crate for Glue ZLIB when combined with
# `aws-glue-schema-registry`.
gzip = ["dep:flate2"]
# Enable Snappy compression.
snappy = ["dep:snap"]
# Enable LZ4 compression.
lz4 = ["dep:lz4_flex"]
# Enable Zstd compression (requires C toolchain via zstd-sys).
zstd = ["dep:zstd"]
# Enable AWS MSK IAM authentication with full SDK credential chain support.
# This adds the AWS SDK for automatic credential discovery (EC2, ECS, EKS, SSO).
# Binary size impact: +2-3 MB (release build).
# If binary size is critical, use manual credential loading with AwsMskIamCredentials::from_env()
# which works without this feature.
aws-msk = ["dep:aws-config", "dep:aws-credential-types"]
# Enable the built-in OIDC token provider for SASL/OAUTHBEARER: the OAuth 2.0
# `client_credentials` grant (KIP-768) plus the RFC 7523 client-assertion
# variant (KIP-1258).
#
# Without it, `OAuthBearerTokenProvider` is still available and you supply
# tokens yourself; this feature is the batteries-included path.
#
# No cryptography dependency is added. Assertions are supplied as pre-signed
# JWTs — read from a file written by a sidecar, or produced by a callback —
# because pinning an RSA/ECDSA implementation on every user is a supply-chain
# decision that belongs to the application, not the client.
oauth-oidc = ["dep:serde", "dep:serde_json", "tokio/fs"]
# Enable loading platform-native root certificates for TLS client verification.
# When enabled, `TlsConfig::with_native_roots()` can use the OS trust store.
native-tls-roots = ["dep:rustls-native-certs"]
# Enable protocol versions that Kafka itself marks `latestVersionUnstable`, i.e.
# versions a released broker does not advertise unless it was started with
# `unstable.api.versions.enable=true`.
#
# Includes ApiVersions v5 (KIP-1242), InitProducerId v6 (KIP-939 two-phase
# commit) and the Share Consumer (KIP-932) module.
#
# Fetch v17/v18 are NOT in this list: they shipped in Kafka 4.0 and 4.1 as
# stable versions and are negotiated by default.
unstable-protocol = []
# Enable KIP-714 client telemetry APIs (GetTelemetrySubscriptions, PushTelemetry).
telemetry = []
# Enable the in-process fake Kafka broker in `krafka::testing`.
#
# A real TCP listener speaking the real wire protocol, with hooks to inject
# specific errors, delays and cluster changes. Intended for client tests that
# would otherwise need Docker; it is not compiled into production builds.
test-broker = []
# Enable SOCKS5 proxy support for connecting to brokers through a proxy.
# Useful for VPN/bastion host setups where brokers are not directly reachable.
socks5 = ["dep:tokio-socks"]
# Use the ring cryptography backend for TLS (default).
# Mutually exclusive with `rustls-aws-lc-rs`.
ring = ["rustls/ring", "tokio-rustls/ring"]
# Use the aws-lc-rs cryptography backend for TLS instead of ring.
# Prefer this on AWS Graviton / FIPS-compliant deployments.
# Mutually exclusive with `ring`.
rustls-aws-lc-rs = ["rustls/aws_lc_rs", "tokio-rustls/aws-lc-rs"]

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = { version = "0.5", features = ["async_tokio"] }
rstest = "0.25"
testcontainers = "0.27"
# Property-based testing for wire-protocol encode/decode round-trip invariants.
proptest = "1"
# Used by tests/crypto_backend.rs to assert that no process-level rustls
# CryptoProvider is installed, which is what makes that regression test
# meaningful. Resolves to the same crate version as the main dependency.
rustls = { version = "0.23", default-features = false }

[[bench]]
name = "producer"
harness = false

[[bench]]
name = "consumer"
harness = false

[[bench]]
name = "protocol"
harness = false


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "deny"
# Denied rather than warned, for the same reason as the clippy lints below: a
# warning binds only PRs that pass through CI's `-Dwarnings`, while a deny binds
# anyone who builds the crate. An undocumented public item in a client library
# is a defect — this crate's own review history includes a feature that was
# implemented, documented and uncallable, and the documentation is what people
# reach for first.
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.rustdoc]
# A documentation link that resolves to nothing renders as plain text, so the
# reader sees a name with no way to reach it and the author sees nothing at all.
# `[crate::producer::ProducerConfigBuilder::max_in_flight]` sat in
# `ConnectionConfigBuilder`'s docs for several releases after that builder was
# deleted, pointing at a type the crate no longer had — and CI's
# `RUSTDOCFLAGS: -Dwarnings` did not catch it, because this lint is
# allow-by-default for private items.
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
# The crate advertises a no-panic posture on every non-test path: broker
# responses are untrusted input, so a malformed frame must surface as a
# `KrafkaError`, never abort the caller's process. Denying (rather than warning)
# means the guarantee holds for anyone building the crate, not just for PRs that
# go through CI's `RUSTFLAGS: -Dwarnings`.
#
# Test modules opt out with a module-level
# `#[allow(clippy::unwrap_used, clippy::expect_used, clippy::panic)]`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"

# An `async fn` with no `await` inside is contagious: it forces every caller —
# and every caller's caller — to be async for what is a synchronous operation,
# and it costs a future state machine at every call site.
#
# Five had accumulated. `BrokerConnection::negotiate_api_version` made 86 call
# sites `.await` a `parking_lot::Mutex` lookup, and `Producer::metrics()` was
# the only metrics accessor in the crate that could not be read from a
# synchronous context — a Prometheus scrape handler could call
# `Consumer::metrics()` but not the producer's.
unused_async = "deny"

[profile.release]
lto = true
codegen-units = 1
