[package]
name = "krafka"
version = "0.27.0"
edition = "2024"
rust-version = "1.95"
authors = ["hupe1980"]
description = "An async Apache Kafka client in pure Rust: producer, transactions, consumer groups, share groups and admin"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/krafka"
documentation = "https://docs.rs/krafka"
readme = "README.md"
keywords = ["kafka", "async", "streaming", "messaging"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# Async runtime
tokio = { version = "1.47", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-util = { version = "0.7.10", default-features = false, features = ["time"] }

# Zero-copy buffers
bytes = "1.11.1"

# Error handling
thiserror = "2.0.3"

# Stream trait for async iteration
futures-core = "0.3.31"

# FutureExt::catch_unwind for panic-safe event loop tasks
futures = { version = "0.3", default-features = false, features = ["async-await", "std"] }

# Logging and tracing
tracing = "0.1.41"

# Compression
flate2 = "1"                                          # gzip
snap = "1"                                            # snappy
lz4_flex = "0.11.6"                                   # lz4
ruzstd = "0.8"                                        # zstd decode (pure Rust, always on)
zstd = { version = "0.13", optional = true }          # zstd encode (requires C toolchain via zstd-sys)

# CRC32 for protocol
crc32c = "0.6"

# Random number generation
rand = "0.9"

# Synchronization (non-poisoning RwLock)
parking_lot = "0.12"

# Fast non-cryptographic hasher for hot-path HashMap lookups.
ahash = "0.8"

# TCP keepalive configuration
socket2 = "0.5"

# Cryptography for SASL/SCRAM
sha2 = "0.10.2"
hmac = "0.13"
pbkdf2 = { version = "0.12.1", default-features = false, features = ["hmac"] }
base64 = "0.22"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.5"

# TLS/SSL support
tokio-rustls = { version = "0.26", default-features = false, features = ["logging"] }
# 0.23.45 fixes GHSA-2mjx-qc3c-rqvc (RUSTSEC-2026-0285); `just advisory-floors`
# fails if this floor admits an advised version.
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12"] }
webpki-roots = "1"
rustls-native-certs = { version = "0.8.1", optional = true }
# Decrypts passphrase-protected PKCS#8 client keys (optional).
pkcs8 = { version = "0.10", optional = true, default-features = false, features = ["std", "encryption", "pem"] }

# AWS SDK credential chain for MSK IAM (optional, `aws-msk`). Only the
# credentials-process and SSO providers plus the HTTPS client are enabled.
aws-config = { version = "1.6", optional = true, default-features = false, features = ["credentials-process", "default-https-client", "rt-tokio", "sso"] }
aws-credential-types = { version = "1.2.2", optional = true }
arc-swap = "1.9.0"

# SOCKS5 proxy support
tokio-socks = "0.5"

# JSON serialisation for the OIDC token provider (optional)
serde = { version = "1.0.210", features = ["derive"], optional = true }
serde_json = { version = "1.0.45", optional = true }

[features]
default = ["ring"]
# Enable Zstd *compression* on the producer (requires a C toolchain via
# zstd-sys). Zstd decompression is pure Rust and always available.
zstd = ["dep:zstd"]
# AWS SDK credential chain for MSK IAM (EC2, ECS, EKS, SSO); adds about 2-3 MB
# to a release binary. `AwsMskIamCredentials::from_env()` works without it.
aws-msk = ["dep:aws-config", "dep:aws-credential-types"]
# Built-in OIDC token provider for SASL/OAUTHBEARER: the OAuth 2.0
# `client_credentials` grant (KIP-768) and the RFC 7523 client-assertion
# variant (KIP-1258). Without it, supply tokens through
# `AuthConfig::sasl_oauthbearer_provider`. Adds no cryptography dependency:
# assertions are pre-signed JWTs from a file or a callback.
oauth-oidc = ["dep:serde", "dep:serde_json", "tokio/fs"]
# Platform-native root certificates: `TlsConfig::with_native_roots()`.
native-tls-roots = ["dep:rustls-native-certs"]
# Passphrase-encrypted client private keys (`ssl.key.password`):
# `TlsConfig::with_client_key_password()` and `KAFKA_SSL_KEY_PASSWORD`.
# Decrypts PEM `ENCRYPTED PRIVATE KEY` (PKCS#8 PBES2: PBKDF2-HMAC-SHA-2 or
# scrypt; AES-CBC). Adds the RustCrypto `pkcs8` stack.
tls-encrypted-keys = ["dep:pkcs8"]
# Protocol versions Kafka marks `latestVersionUnstable`: ApiVersions v5
# (KIP-1242) and InitProducerId v6 (KIP-939). A broker advertises them only
# with `unstable.api.versions.enable=true`; outside semver.
unstable-protocol = []
# In-process fake Kafka broker in `krafka::testing` (outside semver): a TCP
# listener speaking the wire protocol, with hooks to inject errors, delays and
# cluster changes.
test-broker = []
# Tooling only, not a user feature and outside semver: exposes
# `krafka::__private` to krafka's own benches and fuzz targets.
internal = []
# ring TLS crypto backend (default). No post-quantum key exchange.
ring = ["rustls/ring", "tokio-rustls/ring"]
# aws-lc-rs TLS crypto backend; selected when both backends are enabled.
# Offers the hybrid post-quantum X25519MLKEM768 key exchange first. Compiles C
# (aws-lc-sys).
rustls-aws-lc-rs = ["rustls/aws_lc_rs", "rustls/prefer-post-quantum", "tokio-rustls/aws-lc-rs"]

[dev-dependencies]
tokio-test = "0.4"
# Paused time for the simulation and cancel-safety suites.
tokio = { version = "1.47", features = ["test-util"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
criterion = { version = "0.5", features = ["async_tokio"] }
rstest = "0.25"
testcontainers = "0.27"
# Property-based testing for wire-protocol encode/decode round-trip invariants.
proptest = "1"
# tests/crypto_backend.rs asserts no process-level rustls CryptoProvider is
# installed. Same crate version as the main dependency.
rustls = { version = "0.23.45", default-features = false }

# The micro-benchmarks reach the wire-protocol layer through `__private`.
[[bench]]
name = "producer"
harness = false
required-features = ["internal"]

[[bench]]
name = "consumer"
harness = false
required-features = ["internal"]

[[bench]]
name = "protocol"
harness = false
required-features = ["internal"]

# End-to-end send path against the fake broker: a krafka-vs-krafka regression
# gate, not a quotable benchmark.
[[bench]]
name = "send_path"
harness = false
required-features = ["test-broker"]

# End-to-end consume path (`poll`, `recv`) against the fake broker; the same
# krafka-vs-krafka gate as `send_path`.
[[bench]]
name = "consume_path"
harness = false
required-features = ["test-broker"]

[[example]]
name = "fake_broker"
required-features = ["test-broker"]

[[example]]
name = "oauth_oidc"
required-features = ["oauth-oidc"]

[[example]]
name = "msk_iam"
required-features = ["aws-msk"]


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "deny"
# Lints are denied, not warned, so they bind every build, not only CI's.
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)', 'cfg(tokio_unstable)'] }
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.rustdoc]
# A broken doc link renders as plain text; the private-item lint is
# allow-by-default, so both are denied.
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
# No panics on non-test paths: broker responses are untrusted input, so a
# malformed frame surfaces as a `KrafkaError`. Test modules opt out with
# `#[allow(clippy::unwrap_used, clippy::expect_used, clippy::panic)]`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"

# An `async fn` without `await` forces every caller to be async.
unused_async = "deny"

# A future larger than `future-size-threshold` (clippy.toml) fails the build:
# every caller's future embeds it.
large_futures = "deny"

[profile.release]
lto = true
codegen-units = 1
