# Zola configuration for the krafka documentation site.

base_url = "https://hupe1980.github.io/krafka"
title = "krafka"
description = "A pure-Rust async Apache Kafka client on Tokio, with producers, consumer groups, transactions and admin APIs."
author = "krafka contributors"

default_language = "en"
compile_sass = true
minify_html = true
generate_feeds = true
feed_filenames = ["atom.xml"]

# Client-side search; keep top-level settings above the first TOML table.
build_search_index = true

[link_checker]
internal_level = "error"
external_level = "warn"

[search]
index_format = "elasticlunr_json"

[markdown.highlighting]
# CSS classes support light and dark themes without regenerating pages.
style = "class"
light_theme = "catppuccin-latte"
dark_theme = "catppuccin-mocha"

[markdown]
insert_anchor_links = "heading"
smart_punctuation = false
bottom_footnotes = true

[extra]
repo = "https://github.com/hupe1980/krafka"
crate = "https://crates.io/crates/krafka"
api_docs = "https://docs.rs/krafka"
# Footer and JSON-LD version; checked by just version-check.
version = "0.31.0"
license = "MIT OR Apache-2.0"
# Social preview card. Referenced by og:image and twitter:image.
og_image = "og.png"

# Flat page URLs keep navigation grouping independent of links.
[[extra.nav]]
title = "Start here"
pages = ["getting-started", "cookbook", "configuration", "upgrading", "migrating-from-rdkafka"]

[[extra.nav]]
title = "Clients"
pages = ["producer", "consumer", "share-consumer", "admin"]

[[extra.nav]]
title = "Integration"
pages = ["authentication", "cloud", "interceptors"]

[[extra.nav]]
title = "Operations"
pages = ["metrics", "performance", "testing", "errors"]

[[extra.nav]]
title = "Reference"
pages = ["protocol", "architecture", "governance"]
