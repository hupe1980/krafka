[[scope]]
id = "GSSAPI"
title = "SASL/GSSAPI (Kerberos) authentication"
status = "out-of-scope"
reason = "No mature pure-Rust GSSAPI implementation exists, and linking system Kerberos libraries would add a C dependency for every user."

[[scope]]
id = "schema-registry"
title = "Schema registry client"
status = "out-of-scope"
reason = "A schema registry is a separate service with its own protocol; krafka provides the serdes::Serializer and Deserializer hooks instead."

[[scope]]
id = "runtime-agnostic"
title = "Async runtimes other than Tokio"
status = "out-of-scope"
reason = "krafka is built on Tokio and does not abstract over the async runtime."

[[scope]]
id = "streams-runtime"
title = "Kafka Streams runtime"
status = "out-of-scope"
reason = "krafka is a client library with no stream-processing runtime, which is also why StreamsGroupHeartbeat is not implemented."

[[scope]]
id = "broker-internal-apis"
title = "Broker-, controller- and KRaft-internal APIs"
status = "out-of-scope"
reason = "APIs such as LeaderAndIsr, UpdateMetadata, Vote and the share-group state persister are spoken between brokers, not by clients."

# APIs in DELIBERATE_GAPS that krafka implements below Kafka's ceiling; their
# reasons live in DELIBERATE_GAPS.
[gaps]
ceiling = ["AlterConfigs", "SaslHandshake", "SaslAuthenticate"]

[feature.ring]
description = "rustls crypto backend using `ring`."

[feature.rustls-aws-lc-rs]
description = "rustls crypto backend using `aws-lc-rs`; offers post-quantum X25519MLKEM768 key exchange first. Compiles C and needs CMake (`aws-lc-sys`)."

[feature.zstd]
description = "Zstd compression on the producer via `zstd`, which compiles C (`zstd-sys`). Zstd decompression is pure Rust and always on."

[feature.aws-msk]
description = "AWS MSK IAM authentication with the SDK credential chain; compiles C and needs CMake (`aws-lc-sys`)."

[feature.oauth-oidc]
description = "Built-in OIDC token provider for SASL/OAUTHBEARER: the `client_credentials` grant (KIP-768) and RFC 7523 client assertions (KIP-1258). Adds no cryptography dependency."

[feature.native-tls-roots]
description = "Load platform-native root certificates via `rustls-native-certs`."

[feature.tls-encrypted-keys]
description = "Passphrase-encrypted PKCS#8 client keys (`ssl.key.password`) via the RustCrypto `pkcs8` crate."

[feature.unstable-protocol]
description = "Protocol versions Kafka marks `latestVersionUnstable`; a released broker advertises them only with `unstable.api.versions.enable=true`. No semver promise."

[feature.test-broker]
description = "In-process fake Kafka broker (`krafka::testing`) for testing your own code against a real client. Not for production builds; no semver promise."

[feature.internal]
description = "Tooling only: exposes `krafka::__private` to krafka's own benches and fuzz targets. Not a user feature; no semver promise."
