# The capability registry: every KIP named in published prose, scope
# exclusions, Cargo feature descriptions, and which DELIBERATE_GAPS entries are
# version ceilings. `just gen-claims` generates the README and site tables from
# it; `just claims-check` fails when they drift or the evidence does not
# resolve. See xtask/claims.py.
#
# [[kip]] / [[scope]]: id, title, status (implemented | partial |
# not-implemented | out-of-scope), evidence, reason (required unless
# implemented), absent (DELIBERATE_GAPS APIs the KIP needs).
# Evidence: "api:<Name>@<version>" (an api_versions! row reaching it),
# "feature:<cargo feature>", "symbol:krafka::<path>" (compiled in
# tests/kip_evidence.rs).

