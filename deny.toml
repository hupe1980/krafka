# cargo-deny configuration for krafka.
# Run: `cargo deny check` to audit licenses, bans, and advisories.
# Install: `cargo install cargo-deny`

[graph]
# Resolve the dependency graph with all features enabled so we audit every
# possible dependency, not just the default-feature subset.
all-features = true

# ---------------------------------------------------------------------------
# License checks
# ---------------------------------------------------------------------------
[licenses]
# Minimum confidence required to accept a license identified via SPDX
# expression scanning (0.0–1.0).
confidence-threshold = 0.8

# List of explicitly allowed SPDX identifiers.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    # Community Data License Agreement (Permissive). Used by `webpki-roots`,
    # which packages the Mozilla CA root store as data rather than code.
    "CDLA-Permissive-2.0",
]

# NOTE: the `[licenses] deny` key was removed in cargo-deny 0.15
# (https://github.com/EmbarkStudios/cargo-deny/pull/611). `allow` is now an
# exhaustive allowlist: any license not listed above is rejected, which covers
# every copyleft license this section used to enumerate. Keeping the old key
# made `cargo deny check` fail config validation outright, silently disabling
# the licenses, bans, advisories AND sources checks.

# ---------------------------------------------------------------------------
# Dependency bans
# ---------------------------------------------------------------------------
[bans]
# Forbid multiple versions of the same crate (use skip/skip-tree for known ok).
multiple-versions = "warn"

# Crates that must never be included for security / correctness reasons.
deny = [
    # Unmaintained OpenSSL binding; prefer rustls.
    { name = "openssl" },
]

# Known acceptable duplicate crate versions introduced by the dependency tree
# (e.g., transitive deps that haven't been updated yet).
skip = []

# ---------------------------------------------------------------------------
# Security advisories
# ---------------------------------------------------------------------------
[advisories]
# Fail on any unignored security vulnerability.
version = 2
# Path to a local advisory database clone (optional; omit to use GitHub fetch).
# db-path = "~/.cargo/advisory-db"

# Treat yanked crates as an error.
yanked = "deny"

# Advisories that are unreachable from the published library.
#
# Every entry below reaches the graph ONLY through `[dev-dependencies]`
# (`criterion` for benchmarks, `testcontainers` for the integration suite), so
# no krafka user links against them. Verify with:
#
#     cargo tree -e normal --all-features | grep <crate>
#
# which must produce no output. Re-audit this list whenever dev-dependencies
# change; anything reachable via `-e normal` must be fixed, not ignored.
ignore = []

# ---------------------------------------------------------------------------
# Source allowlist
# ---------------------------------------------------------------------------
[sources]
# Only allow crates from crates.io and the workspace itself.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
